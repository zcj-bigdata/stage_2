openapi: 3.0.3
info:
  title: ZCJ Search Engine — Stage 2 API
  version: 1.1.0
  description: |
    API of the Stage 2 search engine (group ZCJ). Four processes run on the same host:

    | Service           | Default URL             | Role |
    |-------------------|-------------------------|------|
    | Control Module    | http://localhost:7000   | Orchestrator (caller of the internal APIs) |
    | Ingestion Service | http://localhost:7001   | Downloads books into the datalake |
    | Indexing Service  | http://localhost:7002   | Updates metadata and inverted index |
    | Search Service    | http://localhost:7003   | Front-end API |

    Endpoints are grouped by consumer with tags:

    * **Front-end** — consumed by the front-end (or any HTTP client validating the contract).
    * **Internal: Ingestion** / **Internal: Indexing** — consumed by the Control Module.
    * **Operational** — health checks used by the Control Module and by operators.

    Every operation also declares its provider and consumers with `x-provider` and `x-consumers`.

    **Conventions**

    * Responses are JSON (`application/json`) with `snake_case` field names.
    * Every error uses the same body: `{"error": "<code>", "message": "<text>"}`.
    * Ports and URLs are configurable with environment variables (`PORT`, `INGESTION_URL`,
      `INDEXING_URL`, `SEARCH_URL`); the URLs below are the single-machine defaults.
    * The Search Service enables CORS (`CORS_ORIGIN`, any origin by default) so that a
      browser front-end served from another origin can call it.

    **Status of this specification**: the front-end and operational endpoints are
    implemented. The internal endpoints follow the contract of the project guide and are
    the agreed interface for the Ingestion and Indexing owners.
  contact:
    name: Group ZCJ
    url: https://github.com/zcj-bigdata/stage_2

servers:
  - url: http://localhost:7003
    description: Search Service (default server; internal paths override it)

tags:
  - name: Front-end
    description: "Search API consumed by the front-end. Provider: Search Service."
  - name: "Internal: Ingestion"
    description: "Consumed by the Control Module. Provider: Ingestion Service."
  - name: "Internal: Indexing"
    description: "Consumed by the Control Module. Provider: Indexing Service."
  - name: Operational
    description: Health and workflow status endpoints.

paths:

  # -------------------------------------------------------------------------
  # FRONT-END API — Search Service
  # -------------------------------------------------------------------------

  /search:
    get:
      tags: [Front-end]
      operationId: searchBooks
      summary: Keyword search with optional filters and pagination
      description: |
        Returns the books that contain **every** term of `q` (AND). The query is
        tokenized with the same rules as the index: lowercase, and every character
        outside `a-z` is a separator, so `Mr. Darcy` searches for `mr` and `darcy`.

        **Ordering**: by `hits` (total occurrences of the query terms in the book),
        descending, then by `book_id` ascending. The order is deterministic, so
        consecutive pages never overlap.

        **Filters** can be combined; a book must satisfy all of them:
        * `author`: case-insensitive substring of the author (ASCII letters).
        * `language`: exact ISO 639-1 code.
        * `year`: exact year of the Project Gutenberg release date (the original
          publication year is not available in the Gutenberg header).

        **Pagination**: `total` is the number of matching books; `results` only
        contains the requested page. A page beyond the end returns an empty list.

        **Consistency**: the count and the page are read from the same committed
        snapshot of the datamart, so a book being indexed is either fully visible or
        not visible at all.

        This operation is read-only and safe to retry.
      x-provider: Search Service
      x-consumers: [Front-end]
      parameters:
        - name: q
          in: query
          required: true
          description: Keywords. At least one word of letters a-z, at most 10 distinct words.
          schema: {type: string, minLength: 1}
          example: sherlock holmes
        - name: author
          in: query
          required: false
          description: Case-insensitive substring of the author name.
          schema: {type: string}
          example: doyle
        - name: language
          in: query
          required: false
          description: ISO 639-1 code (2 or 3 lowercase letters), e.g. `en`, `es`, `fr`.
          schema: {type: string, pattern: '^[a-zA-Z]{2,3}$'}
          example: en
        - name: year
          in: query
          required: false
          description: Year of the Gutenberg release date.
          schema: {type: integer, minimum: 0, maximum: 9999}
          example: 1999
        - name: offset
          in: query
          required: false
          description: Number of results to skip.
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - name: limit
          in: query
          required: false
          description: Maximum number of results in the page.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Search completed. An empty `results` list means no matches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SearchResponse'}
              examples:
                withResults:
                  summary: GET /search?q=sherlock holmes&limit=2
                  value:
                    query: sherlock holmes
                    terms: [sherlock, holmes]
                    filters: {}
                    total: 1
                    offset: 0
                    limit: 2
                    results:
                      - {book_id: 1661, title: The Adventures of Sherlock Holmes, author: Arthur Conan Doyle, language: en, year: 1999, hits: 559}
                withFilters:
                  summary: GET /search?q=the&language=en&limit=2
                  value:
                    query: the
                    terms: [the]
                    filters: {language: en}
                    total: 5
                    offset: 0
                    limit: 2
                    results:
                      - {book_id: 98, title: A Tale of Two Cities, author: Charles Dickens, language: en, year: 1994, hits: 8053}
                      - {book_id: 1661, title: The Adventures of Sherlock Holmes, author: Arthur Conan Doyle, language: en, year: 1999, hits: 5630}
                noMatches:
                  summary: GET /search?q=zzzzqx
                  value: {query: zzzzqx, terms: [zzzzqx], filters: {}, total: 0, offset: 0, limit: 20, results: []}
        '400':
          description: |
            Malformed parameters: `q` missing or without letters, more than 10 words,
            non-integer or out-of-range `year`/`offset`/`limit`, or invalid `language`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_parameter, message: limit must be between 1 and 100}
        '500': {$ref: '#/components/responses/InternalError'}

  /books/{book_id}:
    get:
      tags: [Front-end]
      operationId: getBook
      summary: Metadata of one indexed book
      description: Read-only and safe to retry.
      x-provider: Search Service
      x-consumers: [Front-end]
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: The book is indexed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Book'}
              example: {book_id: 1342, title: Pride and Prejudice, author: Jane Austen, language: en, year: 1998}
        '400':
          description: '`book_id` is not a positive integer.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_parameter, message: book_id must be an integer}
        '404':
          description: The book is not indexed (not ingested yet, or not published yet).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: not_found, message: Book 999999 is not indexed}
        '500': {$ref: '#/components/responses/InternalError'}

  /search/filters:
    get:
      tags: [Front-end]
      operationId: getFilterValues
      summary: Values available for the search filters
      description: |
        Languages, years and authors present in the index, each one with the number
        of books, sorted by value. Used by the front-end to build the filter choices.
      x-provider: Search Service
      x-consumers: [Front-end]
      responses:
        '200':
          description: Filter values.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FilterValues'}
              example:
                languages: [{value: en, books: 5}]
                years: [{value: 1993, books: 1}, {value: 1998, books: 1}]
                authors: [{value: Jane Austen, books: 1}, {value: Lewis Carroll, books: 1}]
        '500': {$ref: '#/components/responses/InternalError'}

  # -------------------------------------------------------------------------
  # INTERNAL API — Ingestion Service
  # -------------------------------------------------------------------------

  /ingest/{book_id}:
    post:
      tags: ["Internal: Ingestion"]
      operationId: ingestBook
      summary: Download a book and store it in the datalake
      description: |
        Downloads `https://www.gutenberg.org/cache/epub/{id}/pg{id}.txt`, splits it into
        header and body and stores both files in the range-based datalake
        (`datalake/ranges/001000-001999/{id}.header.txt` and `.body.txt`).

        **Completion**: synchronous. A `200` response means both files are completely
        written and the ingestion is recorded persistently; from that moment
        `GET /ingest/status/{book_id}` returns `available` and the book is eligible
        for indexing.

        **Idempotency**: calling it again for an available book does not download it
        again and returns `200` with `status: already_available`. Concurrent calls for
        the same book produce a single copy in the datalake.

        **Caller (Control Module)**: timeout 60 s. On timeout or `502`, check
        `GET /ingest/status/{book_id}` and retry with backoff; retrying is safe.
        `404` and `422` are permanent: do not retry.
      x-provider: Ingestion Service
      x-consumers: [Control Module]
      servers:
        - url: http://localhost:7001
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: The book is available in the datalake.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestResponse'}
              examples:
                downloaded:
                  value: {book_id: 1342, status: downloaded, path: datalake/ranges/001000-001999/1342}
                alreadyAvailable:
                  value: {book_id: 1342, status: already_available, path: datalake/ranges/001000-001999/1342}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404':
          description: Project Gutenberg has no plain-text book with this id (permanent).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: not_found, message: Book 99999999 does not exist in Project Gutenberg}
        '422':
          description: The text has no Gutenberg start/end markers (permanent).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: invalid_book, message: Gutenberg start/end markers not found}
        '502':
          description: Project Gutenberg could not be reached (transient, retry later).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: upstream_error, message: Connection to gutenberg.org timed out}
        '500': {$ref: '#/components/responses/InternalError'}

  /ingest/status/{book_id}:
    get:
      tags: ["Internal: Ingestion"]
      operationId: getIngestionStatus
      summary: Whether a book is available in the datalake
      description: |
        `available` only when the ingestion of the book has completed (both files
        written and recorded). Read-only and safe to retry.
      x-provider: Ingestion Service
      x-consumers: [Control Module]
      servers:
        - url: http://localhost:7001
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Ingestion state of the book.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestStatus'}
              examples:
                available: {value: {book_id: 1342, status: available}}
                notAvailable: {value: {book_id: 5, status: not_available}}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '500': {$ref: '#/components/responses/InternalError'}

  /ingest/list:
    get:
      tags: ["Internal: Ingestion"]
      operationId: listIngestedBooks
      summary: Books available in the datalake
      description: Ids of every book whose ingestion has completed, in ascending order.
      x-provider: Ingestion Service
      x-consumers: [Control Module]
      servers:
        - url: http://localhost:7001
      responses:
        '200':
          description: Available books.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IngestList'}
              example: {count: 5, books: [11, 84, 98, 1342, 1661]}
        '500': {$ref: '#/components/responses/InternalError'}

  # -------------------------------------------------------------------------
  # INTERNAL API — Indexing Service
  # -------------------------------------------------------------------------

  /index/update/{book_id}:
    post:
      tags: ["Internal: Indexing"]
      operationId: indexBook
      summary: Index one book from the datalake
      description: |
        Reads the header and body of the book from the datalake, extracts its metadata
        and replaces its rows in `books` and `postings` inside **one transaction**.

        **Completion and publication**: synchronous. A `200` response means the
        transaction is committed, so the book is already visible to the Search Service.
        A failure rolls back the transaction and leaves the previous state untouched.

        **Idempotency**: reindexing a book replaces its rows (no duplicates). Concurrent
        updates are serialized inside the service (one indexing operation at a time) and by
        the database writer lock. While a rebuild is running, updates are rejected with
        `409 rebuild_in_progress`; the caller retries later.

        **Caller (Control Module)**: call it only after the ingestion of the book has
        completed. Timeout 120 s; on timeout or `5xx` retry with backoff (safe).
        `404` means the book is not in the datalake yet: ingest it first.
      x-provider: Indexing Service
      x-consumers: [Control Module]
      servers:
        - url: http://localhost:7002
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: The book is indexed and published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexUpdateResponse'}
              example: {book_id: 1342, index: updated, total_tokens: 127254, unique_terms: 6342}
        '400': {$ref: '#/components/responses/InvalidParameter'}
        '404':
          description: The book is not available in the datalake.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: not_found, message: 'Book files not found: 1342'}
        '409': {$ref: '#/components/responses/RebuildInProgress'}
        '500': {$ref: '#/components/responses/InternalError'}

  /index/rebuild:
    post:
      tags: ["Internal: Indexing"]
      operationId: rebuildIndex
      summary: Rebuild metadata and inverted index from the whole datalake
      description: |
        Synchronous: responds when every book of the datalake has been processed.

        **Publication**: the whole rebuild runs in **one transaction**. Searches keep
        reading the previous index while it runs (WAL mode) and see the new index only
        after the commit; a failure rolls everything back. Books that are no longer in
        the datalake are removed from the datamart.

        **Concurrency**: only one rebuild can run at a time; a second call, or a
        `POST /index/update/{book_id}` during the rebuild, receives `409 rebuild_in_progress`.
      x-provider: Indexing Service
      x-consumers: [Control Module, Operator]
      servers:
        - url: http://localhost:7002
      responses:
        '200':
          description: Rebuild completed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RebuildResponse'}
              example: {books_processed: 5, elapsed_time: 1.4s, total_tokens: 1072467, total_postings: 33796}
        '404':
          description: The datalake has no books folder yet.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
              example: {error: not_found, message: Datalake ranges directory not found}
        '409': {$ref: '#/components/responses/RebuildInProgress'}
        '500': {$ref: '#/components/responses/InternalError'}

  /index/status:
    get:
      tags: ["Internal: Indexing"]
      operationId: getIndexStatus
      summary: Indexing statistics
      x-provider: Indexing Service
      x-consumers: [Control Module, Operator]
      servers:
        - url: http://localhost:7002
      responses:
        '200':
          description: Current statistics of the datamart.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexStatus'}
              example: {books_indexed: 5, last_update: '2026-11-07T12:47:09.691Z', index_size_mb: 4.4, total_terms: 16804, total_postings: 33796}
        '500': {$ref: '#/components/responses/InternalError'}

  # -------------------------------------------------------------------------
  # OPERATIONAL
  # -------------------------------------------------------------------------

  /status:
    get:
      tags: [Operational]
      operationId: getServiceStatus
      summary: Health check (every service)
      description: |
        Implemented by the four processes on their own port (7000, 7001, 7002, 7003).
        Used by the Control Module to check that a service is up before sending work,
        and by operators. Read-only.
      x-provider: Every service
      x-consumers: [Control Module, Operator]
      servers:
        - url: http://localhost:7000
          description: Control Module
        - url: http://localhost:7001
          description: Ingestion Service
        - url: http://localhost:7002
          description: Indexing Service
        - url: http://localhost:7003
          description: Search Service
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceStatus'}
              example: {service: search-service, status: running, started_at: '2026-10-27T13:11:10Z'}

  /control/status:
    get:
      tags: [Operational]
      operationId: getWorkflowStatus
      summary: Progress of the orchestrated pipeline
      description: Number of books downloaded, indexed, failed and pending.
      x-provider: Control Module
      x-consumers: [Operator]
      servers:
        - url: http://localhost:7000
      responses:
        '200':
          description: Workflow state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WorkflowStatus'}
              example: {downloaded: 120, indexed: 118, failed: 3, pending: 2}

  /control/metrics:
    get:
      tags: [Operational]
      operationId: getCoordinationMetrics
      summary: Coordination cost measured by the Control Module
      description: |
        Counters and times measured on the caller side since the Control Module started,
        so they include HTTP, waiting and retries. `books_per_second` is computed over
        `active_s` (from the first call to the last indexed book), not over the uptime.
        Read-only.
      x-provider: Control Module
      x-consumers: [Operator, Benchmarks]
      servers:
        - url: http://localhost:7000
      responses:
        '200':
          description: Coordination metrics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ControlMetrics'}
              example:
                running: true
                workers: 1
                uptime_s: 12.5
                books_indexed: 5
                books_failed: 0
                active_s: 1.52
                books_per_second: 3.29
                ingest_calls: 5
                avg_ingest_ms: 38.1
                index_calls: 5
                avg_index_ms: 251.7
                avg_book_ms: 290.4
                retries: 0
                backoff_wait_ms: 0

components:

  parameters:
    BookId:
      name: book_id
      in: path
      required: true
      description: Project Gutenberg book id.
      schema: {type: integer, minimum: 1}
      example: 1342

  responses:
    RebuildInProgress:
      description: A rebuild is running; retry after it finishes.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: rebuild_in_progress, message: A rebuild is already running}
    InvalidParameter:
      description: A parameter is malformed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: invalid_parameter, message: book_id must be an integer}
    InternalError:
      description: Unexpected error (e.g. the datamart cannot be read). Safe to retry for read operations.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
          example: {error: internal_error, message: database is locked}

  schemas:

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable code.
          enum: [invalid_parameter, not_found, invalid_book, upstream_error, rebuild_in_progress, not_implemented, internal_error]
        message:
          type: string
          description: Human-readable explanation.

    Book:
      type: object
      required: [book_id, title, author, language, year]
      properties:
        book_id: {type: integer}
        title: {type: string, nullable: true}
        author: {type: string, nullable: true}
        language: {type: string, nullable: true, description: ISO 639-1 code}
        year: {type: integer, nullable: true, description: Year of the Gutenberg release date}

    SearchResult:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          required: [hits]
          properties:
            hits:
              type: integer
              description: Total occurrences of the query terms in the book (used for ordering).

    SearchResponse:
      type: object
      required: [query, terms, filters, total, offset, limit, results]
      properties:
        query: {type: string, description: Value of q as received}
        terms:
          type: array
          items: {type: string}
          description: Distinct terms after tokenization
        filters:
          type: object
          description: Filters that were applied (only the ones present in the request)
          properties:
            author: {type: string}
            language: {type: string}
            year: {type: integer}
        total: {type: integer, description: Number of matching books (all pages)}
        offset: {type: integer}
        limit: {type: integer}
        results:
          type: array
          items: {$ref: '#/components/schemas/SearchResult'}

    FilterValue:
      type: object
      required: [value, books]
      properties:
        value:
          oneOf:
            - {type: string}
            - {type: integer}
        books: {type: integer}

    FilterValues:
      type: object
      required: [languages, years, authors]
      properties:
        languages: {type: array, items: {$ref: '#/components/schemas/FilterValue'}}
        years: {type: array, items: {$ref: '#/components/schemas/FilterValue'}}
        authors: {type: array, items: {$ref: '#/components/schemas/FilterValue'}}

    IngestResponse:
      type: object
      required: [book_id, status, path]
      properties:
        book_id: {type: integer}
        status: {type: string, enum: [downloaded, already_available]}
        path: {type: string, description: Folder of the book in the datalake}

    IngestStatus:
      type: object
      required: [book_id, status]
      properties:
        book_id: {type: integer}
        status: {type: string, enum: [available, not_available]}

    IngestList:
      type: object
      required: [count, books]
      properties:
        count: {type: integer}
        books: {type: array, items: {type: integer}}

    IndexUpdateResponse:
      type: object
      required: [book_id, index]
      properties:
        book_id: {type: integer}
        index: {type: string, enum: [updated]}
        total_tokens: {type: integer, description: Tokens in the body of the book}
        unique_terms: {type: integer, description: Distinct terms of the book (postings written)}

    RebuildResponse:
      type: object
      required: [books_processed, elapsed_time]
      properties:
        books_processed: {type: integer}
        elapsed_time: {type: string, example: 35.2s}
        total_tokens: {type: integer}
        total_postings: {type: integer, description: Postings written during the rebuild}

    IndexStatus:
      type: object
      required: [books_indexed, last_update, index_size_mb]
      properties:
        books_indexed: {type: integer}
        last_update: {type: string, format: date-time, nullable: true}
        index_size_mb: {type: number, description: Size of the datamart file}
        total_terms: {type: integer, description: Distinct terms in the inverted index}
        total_postings: {type: integer, description: 'Rows of the inverted index, one per (term, book) pair'}

    ServiceStatus:
      type: object
      required: [service, status, started_at]
      properties:
        service: {type: string}
        status: {type: string, enum: [running]}
        started_at: {type: string, format: date-time}

    WorkflowStatus:
      type: object
      required: [downloaded, indexed, failed, pending]
      properties:
        downloaded: {type: integer}
        indexed: {type: integer}
        failed: {type: integer}
        pending: {type: integer}

    ControlMetrics:
      type: object
      required: [running, workers, uptime_s, books_indexed, books_failed, active_s, books_per_second,
                 ingest_calls, avg_ingest_ms, index_calls, avg_index_ms, avg_book_ms, retries, backoff_wait_ms]
      properties:
        running: {type: boolean, description: Whether the background loop is running}
        workers: {type: integer, description: Books processed in parallel}
        uptime_s: {type: number}
        books_indexed: {type: integer}
        books_failed: {type: integer}
        active_s: {type: number, description: Time from the first call to the last indexed book}
        books_per_second: {type: number}
        ingest_calls: {type: integer}
        avg_ingest_ms: {type: number}
        index_calls: {type: integer}
        avg_index_ms: {type: number}
        avg_book_ms: {type: number, description: 'Ingestion and indexing of one book, including retries'}
        retries: {type: integer}
        backoff_wait_ms: {type: number}
